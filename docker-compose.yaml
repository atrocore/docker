services:
  web:
    build:
      context: .docker
      dockerfile: php/Dockerfile
      args:
        SKELETON_VARIANT: ${SKELETON_VARIANT:-pim-no-demo}
        PRODUCTION_DOMAIN: ${PRODUCTION_DOMAIN:-localhost}
        PRODUCTION_STABILITY: ${PRODUCTION_STABILITY:-stable}
        TESTING_DOMAIN: ${TESTING_DOMAIN}
        TESTING_STABILITY: ${TESTING_STABILITY:-stable}
    volumes:
      - web-data:/var/www/
    networks:
      - proxy
      - default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${PROXY_PRODUCTION_ROUTER}.rule=Host(`${PRODUCTION_DOMAIN}`)"
      - "traefik.http.services.${PROXY_PRODUCTION_ROUTER}.loadbalancer.server.port=80"
      - "traefik.http.routers.${PROXY_PRODUCTION_ROUTER}.entrypoints=websecure" # Replace 'websecure' with 'web' if you don't need SSL
      # Enable SSL for main AtroPIM instance
      - "traefik.http.routers.${PROXY_PRODUCTION_ROUTER}.tls=true"
      - "traefik.http.routers.${PROXY_PRODUCTION_ROUTER}.tls.certresolver=letencrypt"

      # Uncomment to enable testing AtroPIM instance
#      - "traefik.http.routers.${PROXY_TESTING_ROUTER}.rule=Host(`${TESTING_DOMAIN}`)"
#      - "traefik.http.services.${PROXY_TESTING_ROUTER}.loadbalancer.server.port=80"
#      - "traefik.http.routers.${PROXY_TESTING_ROUTER}.entrypoints=websecure" # Replace 'websecure' with 'web' if you don't need SSL
#      # Enable SSL for testing AtroPIM instance
#      - "traefik.http.routers.${PROXY_TESTING_ROUTER}.tls=true"
#      - "traefik.http.routers.${PROXY_TESTING_ROUTER}.tls.certresolver=letencrypt"
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PIM_USER: ${POSTGRES_PIM_USER}
      POSTGRES_PIM_PASSWORD: ${POSTGRES_PIM_PASSWORD}
      POSTGRES_PIM_DB: ${POSTGRES_PIM_DB}
      POSTGRES_PIM_DB_TEST: ${POSTGRES_PIM_DB_TEST}
    volumes:
      - .docker/postgres/scripts:/docker-entrypoint-initdb.d
      - db-data:/var/lib/postgresql/data/
    restart: unless-stopped

volumes:
  web-data:
    # Uncomment if you would like to store files in the host directory
    driver: local
#    driver_opts:
#      type: none
#      o: bind
#      device: ./data/web/
  db-data:
    # Uncomment if you would like to store files in the host directory
#    driver: local
#    driver_opts:
#      type: none
#      o: bind
#      device: ./data/db/

# It will use existing 'proxy' network with Traefik
networks:
  proxy:
    external: true